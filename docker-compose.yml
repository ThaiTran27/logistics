services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-logistics-only}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: smart_logistics_v2
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/smart_logistics_v2.sql:/docker-entrypoint-initdb.d/001-smart-logistics.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5000
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-logistics-only}
      DB_NAME: smart_logistics_v2
      JWT_SECRET: ${JWT_SECRET:-local-docker-development-only}
      NODE_ENV: development
      DEMO_MODE: "true"
      OSRM_URL: http://map-routing:5000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/backend/public/uploads
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "node migrations/run.js up && node server.js"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-5000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    restart: unless-stopped

  map-extract:
    profiles: ["maps"]
    image: danieljh/osmium:latest
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ ! -s /data/govap-region.osm.pbf ]; then
          osmium extract -b 106.59,10.75,106.75,10.93 /data/vietnam-latest.osm.pbf -o /data/govap-region.osm.pbf --overwrite --strategy=complete_ways;
        else
          echo "Gò Vấp routing extract already exists.";
        fi
    volumes:
      - ./backend/map-data:/data
    restart: "no"

  map-tiles:
    profiles: ["maps"]
    image: maptiler/tileserver-gl:v5.5.0
    command: ["--config", "/config/config.json", "--bind", "0.0.0.0"]
    ports:
      - "${MAP_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./backend/map-data:/data:ro
      - ./backend/map-config:/config:ro
    restart: unless-stopped

  map-routing:
    profiles: ["maps"]
    image: osrm/osrm-backend:latest
    command:
      - sh
      - -c
      - >-
        if [ ! -f /data/govap-region.osrm ]; then
          osrm-extract -p /opt/car.lua /data/govap-region.osm.pbf &&
          osrm-partition /data/govap-region.osrm &&
          osrm-customize /data/govap-region.osrm;
        fi &&
        osrm-routed --algorithm mld --max-table-size 100 /data/govap-region.osrm
    depends_on:
      map-extract:
        condition: service_completed_successfully
    ports:
      - "${MAP_BIND_ADDRESS:-127.0.0.1}:5001:5000"
    volumes:
      - ./backend/map-data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  backend_uploads:
